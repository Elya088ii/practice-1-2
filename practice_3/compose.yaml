services:
  web:
    build: .
    # Порт 8080 больше не пробрасываем у веб-сервера, этим займется Nginx
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./index.php:/var/www/html/index.php
      - ./style.css:/var/www/html/style.css
      - ./:/var/www/html

  nginx:
    build: ./nginx
    ports:
      - "8080:80"   # Теперь 8080 порт ведет на Nginx!
    depends_on:
      - web

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: appDB
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - db_data:/var/lib/mysql
      - ./init_api.sql:/docker-entrypoint-initdb.d/init_api.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data: